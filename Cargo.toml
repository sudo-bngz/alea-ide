[package]
name = "alea-ide"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "A studio for alea: write a work, see its edition, reroll the seed"
repository = "https://github.com/sudo-bngz/alea-ide"

[[bin]]
name = "alea-ide"
path = "src/main.rs"

[dependencies]
# The language itself: parser, evaluator and renderers (the library is `alea`).
alea-lang = { git = "https://github.com/sudo-bngz/alea" }
# Qell's editor core, for the alea syntax highlighting.
qell-core = { git = "https://github.com/sudo-bngz/qell" }

egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
# Writing WAV, for a sound render and for an MP4's audio track.
hound = "3.5"
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The engine samples every pixel: unoptimised, a preview takes seconds.
[profile.dev.package."*"]
opt-level = 2
